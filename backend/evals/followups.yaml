- id: tool_named_in_the_answer_may_be_asked_about
  persona: neutral
  kind: deep_dive
  title: your work at Northwind Logistics
  notes: |
    Backend Engineering Intern at Northwind Logistics
    - Moved 3 cron jobs to a Celery queue, removing 2 hours of nightly downtime
  seed: Tell me about moving the cron jobs to a queue at Northwind.
  answer: >-
    The cron jobs locked the shipments table for hours. I moved them onto Celery workers with Redis as
    the broker, and split each job into small batches of a thousand rows. Later we looked at Temporal
    for the longer workflows but didn't switch.

