- id: specific_answer_is_taken_one_level_deeper
  persona: neutral
  kind: deep_dive
  title: Beacon
  notes: |
    Beacon: an uptime monitor for small teams.
    Tech: Python, FastAPI, PostgreSQL, Redis
    - Checks 500 URLs every minute
    - Scheduler takes a Postgres advisory lock so only one worker runs a check
  seed: What does Beacon do, and what part did you build?
  answer: >-
    Beacon checks about five hundred URLs every minute. I wrote the scheduler. Each check is a row in
    Postgres, and a worker takes an advisory lock on the row before running it, so two workers never run
    the same check. If a worker dies the lock is released when its session ends.

