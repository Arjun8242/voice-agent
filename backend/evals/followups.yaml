    Tech: Python, FastAPI, PostgreSQL, Redis
    - Scheduler takes a Postgres advisory lock so only one worker runs a check
  seed: What does Beacon do, and what part did you build?
  answer: >-
    I wrote the scheduler. Workers take a Postgres advisory lock on a check before running it so the
    same URL is never checked twice at once. We already had Postgres, so I used that instead of adding
    anything new.

- id: misconception_is_probed_not_corrected_with_new_facts
  persona: neutral
  kind: technical
  title: PostgreSQL indexes
  notes: |
    Topic: PostgreSQL
    The job description asks for PostgreSQL.
    Where the resume uses it: reduced API latency from 900 ms to 350 ms by adding indexes
  seed: You sped up an API by adding indexes. How do you decide which columns to index?
  answer: >-
    I just add an index to every column that shows up in a where clause. Indexes make reads faster and
    they also make inserts faster because the database can find where to put the row, so there's no
    downside really.

