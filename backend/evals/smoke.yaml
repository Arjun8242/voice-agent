# S6 smoke set. Each question names the evidence it needs: source file + heading.
# Never use chunk ids here, so the labels survive re-chunking.
#
# type:
#   direct         answer sits in one section
#   followup       short question that depends on a topic (project id) set earlier
#   boundary       should retrieve a rule from docs/boundaries.md
#   unanswerable   the KB has nothing on it; retrieval must return nothing
#   exploratory    printed for inspection, never counted as pass/fail
#
# expect: list of acceptable evidence; passing = ANY one is retrieved in the top K.
#   source    exact source path as stored in the index
#   heading   last heading, or "Parent > Child" when the last heading repeats
#   contains  optional words that must appear in that chunk's text

- id: beacon-purpose
  type: direct
  query: "what is beacon and does it solve any real world problem? and how is it different from other uptime platforms"
  expect:
    - {source: docs/projects/beacon.md, heading: "Overview", contains: [uptime]}

- id: beacon-queue
  type: direct
  query: "Why doesn't Beacon just run the health checks inside the API server?"
  expect:
    - {source: docs/projects/beacon.md, heading: "Why use a queue instead of running checks inside the API?", contains: [asynchronously]}

- id: beacon-duplicate-scheduling
  type: direct
  query: "How does it stop two scheduler instances from picking up the same monitor?"
  expect:
    - {source: docs/projects/beacon.md, heading: "How does Beacon prevent multiple schedulers from scheduling the same monitor?", contains: [SKIP LOCKED]}
    - {source: docs/projects/beacon.md, heading: "Engineering Challenge: Double Scheduling > Solution", contains: [SKIP LOCKED]}

- id: beacon-hosting
  type: direct
  query: "Since Beacon is distributed system. so where have you deployed the services?"
  expect:
    - {source: docs/projects/beacon.md, heading: "Deployment", contains: [Render]}

