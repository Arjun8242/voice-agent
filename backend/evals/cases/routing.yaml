# Routing eval test cases (S9).
# Code checks on tool name and arguments; exact match or validated refusal.
# Each case has:
#   id: unique test case identifier
#   category: skill | project_list | project_detail | link | no_tool | boundary | meeting | unclear
#   query: visitor utterance
#   expected_tool: tool name or null (for no-tool turns)
#   expected_args: expected argument map or null
#   expect_refusal: true if result should refuse (e.g. unknown skill, booking)

- id: route-skill-redis
  category: skill
  query: "Does Arjun know Redis?"
  expected_tool: getSkills
  expected_args:
    skill: Redis

- id: route-skill-docker
  category: skill
  query: "Has he worked with Docker?"
  expected_tool: getSkills
  expected_args:
    skill: Docker

- id: route-skill-typescript
