- id: route-skill-unknown-k8s
  category: skill
  query: "Has he used Kubernetes in production?"
  expected_tool: getSkills
  expected_args:
    skill: Kubernetes
  expect_refusal: true

- id: route-skill-unknown-rust
  category: skill
