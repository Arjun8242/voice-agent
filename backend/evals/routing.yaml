# --- unclear: ask instead of guessing a tool -------------------------------
- id: ask-that
  category: unclear
  query: Can you tell me more about that?
  expect: {tool: null, ask: true}
- id: ask-show
  category: unclear
  query: Show me.
  expect: {tool: null, ask: true}
