[project]
name = "voice-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "httpx>=0.27",
    "groq>=0.37",
    "sentence-transformers>=3.0",
    "PyYAML>=6.0",
    "langgraph>=1.2",
    "pydantic>=2",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=9"]  # tests only: pip install -e "backend[dev]"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
