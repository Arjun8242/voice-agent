- id: beacon
  name: Beacon
  one_line: Beacon is a distributed uptime monitoring platform that checks website and API availability, tracks response times, and sends email alerts when services go down or recover. It uses a Redis + BullMQ queue-driven scheduler-worker architecture with a transactional outbox pattern to ensure reliable, duplicate-safe job scheduling.
  status: shipped
  featured: true
  tech: [TypeScript, Next.js, Express, PostgreSQL, Prisma, Redis, BullMQ, Turborepo, Resend]
  role: Designed and built it. 
  links: {repo: https://github.com/Arjun8242/Beacon, live: https://beacon-sigma-henna.vercel.app/, video: null}
  assets: {architecture_image: null}
  highlights:
    - Scheduler, Redis queue and worker pool are separate stages, so slow target sites do not block the API
    - Two scheduler replicas do not double-schedule checks (row claiming with FOR UPDATE SKIP LOCKED plus a transactional outbox)
    - Incidents are tracked from open to resolved, with deduplicated email alerts
    - Worker concurrency is configurable per instance (default 5)
  measured:
    - claim: With two scheduler instances and 3 due monitors, the naive query enqueued 6 jobs and the fixed version enqueued 3
      how: Ran both instances at once and compared enqueued job counts
  updated: 2026-10-22


