- id: valyrian
  name: Valyrian
  one_line: Valyrian is a tree-walking interpreted programming language built from scratch in Java, featuring recursive-descent parsing, AST evaluation, lexical scoping, closures, recursion, arrays, and structured runtime error handling.
  status: runnable_not_deployed
  featured: false
  tech: [Java, Gradle, Recursive Descent Parsing, Abstract Syntax Tree, Visitor Pattern]
  role: Designed and built it from scratch.
  links: {repo: https://github.com/Arjun8242/Valyrian, live: null, video: null}
  assets: {architecture_image: null}
  highlights:
    - Built a complete interpreter pipeline from lexical analysis to parsing and AST evaluation
    - Implemented recursive-descent parsing with operator precedence, panic-mode error recovery, and for-loop desugaring
    - Implemented lexical environment chains, variable shadowing, first-class functions, closures, and recursion
    - Added arrays, indexing, element assignment, short-circuit logical evaluation, and structured runtime error reporting with exit codes
    - Created a test suite of 17 scripts covering language features, scope isolation, control flow, and error handling
  updated: 2026-07-22


